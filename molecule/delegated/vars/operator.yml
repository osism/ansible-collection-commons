# The keys below exercise the additional-key contract and its precedence against
# the deployment-wide lists. Literal values, not anchors or Jinja references: the
# testinfra helper reads this file with include_vars, which does not template.
#
# Ordering in the role is additional-set, additional-delete, primary-set,
# primary-delete, so after convergence:
#
#   test@test.test           primary only                        -> present
#   additional@test.test     additional only                     -> present
#   addthendelete@test.test  additional + additional-delete      -> absent
#   keep@test.test           primary + additional-delete         -> present
#   drop@test.test           additional + primary-delete         -> absent
#
# No assertion here can pass while one of the two new tasks is missing: without
# the additional-set task additional@test.test disappears, and without the
# additional-delete task addthendelete@test.test survives.
