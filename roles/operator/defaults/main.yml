---
operator_user: dragon
operator_user_id: 45000

operator_group: dragon
operator_group_id: 45000

operator_shell: /bin/bash

operator_authorized_keys: []
operator_authorized_keys_delete: []

# Additional keys, intended for group-scoped use: a group_vars file can add a key
# for its hosts without redefining operator_authorized_keys, which Ansible would
# replace rather than merge. Applied before the lists above, so the deployment-wide
# ones stay authoritative.
operator_additional_authorized_keys: []
operator_additional_authorized_keys_delete: []

operator_authorized_github_accounts: []
operator_authorized_github_accounts_delete: []

operator_authorized_keys_minimal: 0

# NOTE: Use "mkpasswd --method=sha-512" to generate a password
# operator_password:

operator_sudo_nopasswd: true

operator_sudo_cmd_list:
  - ALL

operator_environment: {}

# Custom PS1 prompt configuration
# operator_ps1_custom: "[CLOUDPOD-BB]"
# operator_ps1_mode: prepend  # Options: prepend, replace
operator_ps1_mode: prepend
