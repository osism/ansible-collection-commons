---
- name: Leave the network of this host unchanged
  ansible.builtin.debug:
    msg: >-
      network_managed_externally is true for {{ inventory_hostname }}:
      the network role changes nothing on this host.
  when: network_managed_externally | bool
  tags:
    - always

# A static import, so that each task keeps its own tags and --tags or
# --skip-tags select exactly what they did before the body moved here.
- name: Import network management tasks
  ansible.builtin.import_tasks: manage.yml
  when: not (network_managed_externally | bool)
