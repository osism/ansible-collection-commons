---
- name: Reload systemd-networkd
  become: true
  ansible.builtin.service:
    name: systemd-networkd
    state: reloaded
  when: network_allow_service_restart

# netplan apply makes systemd-networkd reconfigure the links, which deletes
# the kernel nexthop objects FRR's zebra installed; zebra does not reinstall
# its multipath routes afterwards, so a BGP node would lose its default route
# (and any other ECMP route) until FRR restarts. The restart runs in the same
# command as netplan apply: on a node whose route back to the controller is
# ECMP, a separate task could not be delivered once netplan has applied.
# It runs even if netplan apply fails (the links may be reconfigured already).
# The handler fails with netplan's status if netplan failed, else with the
# restart's: try-restart is a no-op (0) where FRR is not running, and 5 (no
# such unit, a host without FRR) counts as success.
- name: Netplan configuration changed
  become: true
  ansible.builtin.shell: >-
    netplan apply
    {% if network_restart_frr_after_netplan_apply | bool %}
    ; rc=$?
    ; systemctl try-restart {{ (network_frr_service_name ~ '.service') | quote }}
    ; frr=$?
    ; if [ "$rc" -ne 0 ]; then exit "$rc"; fi
    ; if [ "$frr" -eq 5 ]; then exit 0; fi
    ; exit "$frr"
    {% endif %}
  when: network_allow_service_restart
  changed_when: true

- name: Interfaces file changed
  become: true
  ansible.builtin.service:
    name: "{{ network_service }}"
    state: restarted
  when: network_allow_service_restart
  register: network_service_restart_result

# NOTE: network_configuration_result.results
#       = [ { "item": [ <device>, [<config>, ...] ], ... }, ... ]

- name: Restart network service
  become: true
  ansible.builtin.service:
    name: "{{ network_service }}"
    state: restarted
    arguments: "INTERFACE={{ item.item.0 }}"
  when: >
    network_allow_service_restart
    and (network_service_restart_result is undefined or not network_service_restart_result.changed)
    and ('service' == network_restart_method)
    and item.changed
    and item.item.1.0.auto | default(true)
  with_items: "{{ network_configuration_result.results | default([]) }}"
  tags:
    - skip_ansible_lint

- name: Restart network command
  become: true
  ansible.builtin.shell: >
    {{ network_interface_restart_commands[ network_restart_method ] }}
  when: >
    network_allow_service_restart
    and (network_service_restart_result is undefined or not network_service_restart_result.changed)
    and (network_restart_method in network_interface_restart_commands)
    and item.changed
    and item.item.1.0.auto | default(true)
  with_items: "{{ network_configuration_result.results | default([]) }}"
  tags:
    - skip_ansible_lint

- name: Restart network-extra-init service
  become: true
  ansible.builtin.systemd_service:
    name: network-extra-init
    state: restarted
    daemon_reload: true
